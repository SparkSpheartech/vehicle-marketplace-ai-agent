<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Viewer Test - Kynetik</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #0a0a0a;
            color: white;
            font-family: Arial, sans-serif;
        }
        .viewer-container {
            width: 600px;
            height: 400px;
            border: 2px solid #22c55e;
            margin: 20px 0;
            position: relative;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #22c55e;
        }
        h1 { color: #22c55e; }
        h2 { color: #06b6d4; }
    </style>
</head>
<body>
    <h1>Kynetik 3D Viewer Test</h1>
    <p>Testing REAL GLB car models loading...</p>
    
    <h2>Ferrari 458 Model Test</h2>
    <div id="ferrari-viewer" class="viewer-container">
        <div class="loading">Loading Ferrari 458...</div>
    </div>
    
    <h2>BMW M4 Model Test</h2>
    <div id="bmw-viewer" class="viewer-container">
        <div class="loading">Loading BMW M4...</div>
    </div>
    
    <h2>Concept Car Model Test</h2>
    <div id="concept-viewer" class="viewer-container">
        <div class="loading">Loading Concept Car...</div>
    </div>
    
    <div id="status"></div>

    <script>
        // Car models configuration
        const CAR_MODELS = {
            ferrari: {
                url: 'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/ferrari.glb',
                scale: 0.8,
                position: [0, 0, 0],
                name: 'Ferrari 458'
            },
            bmw_m4: {
                url: 'https://raw.githubusercontent.com/harmasctl/3dmodel-car/main/bmw_m4_f82.glb',
                scale: 0.01,
                position: [0, 0, 0],
                name: 'BMW M4'
            },
            concept: {
                url: 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CarConcept/glTF-Binary/CarConcept.glb',
                scale: 0.5,
                position: [0, 0, 0],
                name: 'Concept Car'
            }
        };

        function createViewer(containerId, modelKey) {
            const container = document.getElementById(containerId);
            const config = CAR_MODELS[modelKey];
            
            // Scene setup
            const scene = new THREE.Scene();
            scene.background = new THREE.Color('#0a0a0a');
            
            // Camera
            const camera = new THREE.PerspectiveCamera(40, 600/400, 0.1, 1000);
            camera.position.set(4, 2, 4);
            
            // Renderer
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(600, 400);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            
            // Controls
            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 1;
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(5, 5, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            // Ground
            const groundGeometry = new THREE.PlaneGeometry(20, 20);
            const groundMaterial = new THREE.MeshStandardMaterial({ color: '#1a1a1a' });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
            
            // Load model
            const loader = new THREE.GLTFLoader();
            
            loader.load(
                config.url,
                (gltf) => {
                    const model = gltf.scene;
                    model.scale.setScalar(config.scale);
                    model.position.set(...config.position);
                    
                    // Center the model
                    const box = new THREE.Box3().setFromObject(model);
                    const center = box.getCenter(new THREE.Vector3());
                    model.position.x -= center.x;
                    model.position.z -= center.z;
                    
                    // Enable shadows
                    model.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });
                    
                    scene.add(model);
                    
                    // Remove loading text
                    const loading = container.querySelector('.loading');
                    if (loading) loading.remove();
                    
                    console.log(`✅ ${config.name} loaded successfully`);
                    updateStatus(`✅ ${config.name} loaded successfully`);
                },
                (progress) => {
                    console.log(`Loading ${config.name}: ${(progress.loaded / progress.total * 100).toFixed(1)}%`);
                },
                (error) => {
                    console.error(`❌ Error loading ${config.name}:`, error);
                    updateStatus(`❌ Error loading ${config.name}: ${error.message}`);
                    
                    // Remove loading text and show error
                    const loading = container.querySelector('.loading');
                    if (loading) {
                        loading.textContent = `Error loading ${config.name}`;
                        loading.style.color = '#ef4444';
                    }
                }
            );
            
            // Add renderer to container
            container.appendChild(renderer.domElement);
            
            // Animation loop
            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();
        }
        
        function updateStatus(message) {
            const status = document.getElementById('status');
            status.innerHTML += '<div>' + message + '</div>';
        }
        
        // Initialize viewers
        console.log('🚀 Starting 3D model tests...');
        updateStatus('🚀 Starting 3D model tests...');
        
        createViewer('ferrari-viewer', 'ferrari');
        createViewer('bmw-viewer', 'bmw_m4');
        createViewer('concept-viewer', 'concept');
    </script>
</body>
</html>
