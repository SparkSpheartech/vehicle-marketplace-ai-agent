<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SWEETRIDE - Map Hub</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .carbon-fiber {
            background-image: radial-gradient(circle at center, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 4px 4px;
        }
        .hud-glow {
            filter: drop-shadow(0 0 8px rgba(204, 255, 0, 0.4));
        }
        .machined-edge {
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#0e0e0e",
                        "on-error": "#690005",
                        "on-tertiary-fixed": "#002022",
                        "on-secondary-fixed-variant": "#852400",
                        "inverse-surface": "#e5e2e1",
                        "primary-fixed": "#c3f400",
                        "on-primary": "#283500",
                        "on-primary-container": "#556d00",
                        "tertiary-container": "#7df4ff",
                        "secondary-container": "#ff571a",
                        "primary": "#ffffff",
                        "on-surface-variant": "#c4c9ac",
                        "inverse-on-surface": "#313030",
                        "secondary": "#ffb59e",
                        "on-error-container": "#ffdad6",
                        "on-tertiary": "#00363a",
                        "surface-tint": "#abd600",
                        "surface-container-highest": "#353534",
                        "surface-dim": "#131313",
                        "inverse-primary": "#506600",
                        "error-container": "#93000a",
                        "surface-bright": "#393939",
                        "surface-container-low": "#1c1b1b",
                        "surface-variant": "#353534",
                        "tertiary": "#ffffff",
                        "surface-container": "#201f1f",
                        "on-background": "#e5e2e1",
                        "tertiary-fixed-dim": "#00dbe9",
                        "error": "#ffb4ab",
                        "on-tertiary-fixed-variant": "#004f54",
                        "on-secondary-container": "#521300",
                        "background": "#131313",
                        "tertiary-fixed": "#7df4ff",
                        "surface": "#131313",
                        "primary-container": "#c3f400",
                        "on-primary-fixed-variant": "#3c4d00",
                        "on-secondary-fixed": "#3a0b00",
                        "secondary-fixed-dim": "#ffb59e",
                        "on-tertiary-container": "#006f77",
                        "surface-container-high": "#2a2a2a",
                        "outline-variant": "#444933",
                        "outline": "#8e9379",
                        "on-secondary": "#5e1700",
                        "on-surface": "#e5e2e1",
                        "on-primary-fixed": "#161e00",
                        "secondary-fixed": "#ffdbd0",
                        "primary-fixed-dim": "#abd600"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin": "24px",
                        "gutter": "16px",
                        "unit": "4px",
                        "container-max": "1200px"
                    },
                    "fontFamily": {
                        "headline-md": ["Space Grotesk"],
                        "stats-num": ["Space Grotesk"],
                        "label-caps": ["Space Grotesk"],
                        "display-lg": ["Space Grotesk"],
                        "body-base": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                        "stats-num": ["32px", {"lineHeight": "1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "700"}],
                        "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "700"}],
                        "body-base": ["16px", {"lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface font-body-base text-on-surface overflow-hidden">
<!-- Top Navigation Bar -->
<header class="fixed top-0 left-0 w-full z-50 bg-black/80 backdrop-blur-md border-b border-white/10 flex justify-between items-center px-6 h-16 shadow-[0_4px_20px_rgba(0,0,0,0.5)] gap-6">
<div class="flex items-center gap-4">
<div class="flex-1 flex-grow">
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute left-3 text-white/40 group-focus-within:text-[#CCFF00] transition-colors">search</span>
<input class="w-full bg-white/5 border border-white/10 rounded-sm py-2 pl-10 pr-4 text-sm text-white placeholder:text-white/20 focus:outline-none focus:border-[#CCFF00]/50 focus:ring-1 focus:ring-[#CCFF00]/20 transition-all font-body-base machined-edge" placeholder="Search for locations, players, or events..." type="text"/>
<div class="absolute right-3 flex items-center gap-1 opacity-40">
<span class="text-[10px] font-label-caps border border-white/20 px-1 rounded-sm">CMD</span>
<span class="text-[10px] font-label-caps border border-white/20 px-1 rounded-sm">K</span>
</div>
</div>
</div>
</div>
<div class="flex items-center gap-6">
<!-- Desktop Top Links -->
<div class="w-10 h-10 rounded-full border-2 border-[#CCFF00]/50 overflow-hidden shadow-[0_0_10px_rgba(204,255,0,0.3)]">
<img alt="User" class="w-full h-full object-cover" data-alt="close-up portrait of a driver wearing a technical racing cap and polarized sunglasses in a high-contrast cinematic style" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBj1w3vDxmwBFjC3AkU8EXcUabByy0IHCAdlOK6ccc1dTS28sunPCR6c_4TUVKXqyCakrpxcTQ-NstJNkciQb1BTJf1Kzcrc0W675A0gwNXVIxmMtXej8XtpxpsSSDGUqjgawrF55W03Lw0JmKPCKcPe140KDp9Bu7pYFhjOXj3u4VkKEYlMc4ZXqsxQpL_ilA1Y-R5QHxmCcNhVwRNMLjHe9Yj3OqrM9Wh5o13tOoVsjmuAD4dk5n20OLvbEMZPGtHTlW9qOCbxvY" style=""/>
</div>
</div>
</header>
<!-- Main Map Container -->
<main class="relative h-screen w-full overflow-hidden">
<!-- Interactive Map Background -->
<div class="absolute inset-0 z-0">
<div class="w-full h-full bg-[#050505] relative overflow-hidden">
<img alt="Map Background" class="w-full h-full object-cover opacity-40 grayscale contrast-125" data-alt="satellite view of dark urban city streets at night with glowing blue neon grid lines and high contrast architectural details" data-location="Los Angeles" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBhNyvJ1eer5NuhrC9_0MDa2Ba5-M806BQY9ZpquOJ4KITcP57PzJ2SWRnMpcdAx7aWhM7OUW2lMFBIDlVplEproATkq9J4zbvuYCPaEo-PzZytSWr5s1aEa2MQUFiGCpBanRYEtC0rG2tXMlYC84vBpD5O92dbGiuRKxaRoeurIulOFvs4Tcwe36Sz4IgAlxYnkRu8n3sosvs0R8frtN4cAq3GZ_insbr_FZNIVfc88n-hzFDtsJhIuREtgKB5KKPSNLKo4idSxek" style=""/>
<!-- Player Markers Overlay -->
<div class="absolute inset-0 pointer-events-none">
<!-- Player 1 -->
<div class="absolute top-1/3 left-1/4 z-30">
<!-- Selected Glow Effect -->
<div class="absolute inset-0 -m-4 bg-[#CCFF00]/20 rounded-full blur-xl animate-pulse"></div>
<div class="relative">
<div class="w-5 h-5 bg-[#CCFF00] rounded-full shadow-[0_0_20px_#CCFF00] border-2 border-white ring-4 ring-[#CCFF00]/30"></div>
<div class="absolute -left-10 bg-[#CCFF00] border border-white/20 px-3 py-2 rounded shadow-2xl flex flex-col gap-1 min-w-[100px] transform -translate-y-2 -top-24">
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between gap-2">
<span class="text-[10px] font-black font-label-caps text-black" style="">X-PULSE_99</span>
<span class="w-1.5 h-1.5 rounded-full bg-black/40"></span>
</div>
<div class="flex items-center gap-1 bg-black/10 px-1.5 py-0.5 rounded-full w-fit">
<span class="material-symbols-outlined text-[10px] text-black" style='font-variation-settings: "FILL" 1;'>sensors</span>
<span class="text-[8px] font-black text-black font-label-caps" style="">WITHIN 100FT</span>
</div>
<div class="flex flex-col gap-1 mt-1">
<button class="flex items-center justify-center gap-1 bg-black text-[#CCFF00] py-1 px-2 rounded-sm hover:opacity-90 transition-opacity" style="">
<span class="material-symbols-outlined text-[14px]" style="">bolt</span>
<span class="text-[9px] font-black font-label-caps" style="">CHALLENGE</span>
</button>
<div class="flex items-center gap-1 opacity-60 cursor-pointer">
<span class="material-symbols-outlined text-[12px] text-black" style="">person</span>
<span class="text-[8px] font-bold text-black font-label-caps tracking-tighter uppercase" style="">View Profile</span>
</div>
</div>
</div>
<!-- Small Pointer Triangle -->
<div class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-2 h-2 bg-[#CCFF00] rotate-45"></div>
</div>
</div>
</div>
<!-- Player 2 -->
<div class="absolute top-1/2 left-2/3">
<div class="w-4 h-4 bg-[#CCFF00] rounded-full shadow-[0_0_15px_#CCFF00] border-2 border-black"></div>
<div class="absolute -top-10 -left-6 bg-black/80 border border-white/10 px-2 py-1 rounded-sm">
<span class="text-[10px] font-label-caps text-white" style="">DRIFT_KING_LA</span>
</div>
</div>
<!-- Player 3 -->
<div class="absolute bottom-1/4 right-1/3">
<div class="w-4 h-4 bg-[#CCFF00] rounded-full shadow-[0_0_15px_#CCFF00] border-2 border-black"></div>
<div class="absolute -top-10 -left-6 bg-black/80 border border-white/10 px-2 py-1 rounded-sm">
<span class="text-[10px] font-label-caps text-white" style="">CARBON_SOUL</span>
</div>
</div>
</div>
</div>
</div>
<!-- HUD Controls (Top Right) -->
<div class="absolute top-24 right-6 z-20 flex flex-col gap-3">
<button class="w-12 h-12 bg-black/80 border border-white/10 flex items-center justify-center hover:bg-[#CCFF00]/10 transition-colors rounded-sm machined-edge" style="">
<span class="material-symbols-outlined text-[#CCFF00]" data-icon="add" style="">add</span>
</button>
<button class="w-12 h-12 bg-black/80 border border-white/10 flex items-center justify-center hover:bg-[#CCFF00]/10 transition-colors rounded-sm machined-edge" style="">
<span class="material-symbols-outlined text-[#CCFF00]" data-icon="remove" style="">remove</span>
</button>
<button class="w-12 h-12 bg-black/80 border border-white/10 flex items-center justify-center hover:bg-[#CCFF00]/10 transition-colors rounded-sm machined-edge mt-4" style="">
<span class="material-symbols-outlined text-[#CCFF00]" data-icon="my_location" data-weight="fill" style="">my_location</span>
</button>
</div>
<!-- Telemetry Speedometer (Bottom Left) -->
<div class="absolute bottom-24 left-4 z-20 flex flex-col gap-2 group/hud"><div class="flex items-center gap-2 mb-1">
<div class="w-6 h-6 bg-black/60 backdrop-blur-md border border-white/10 flex items-center justify-center rounded-sm cursor-pointer hover:bg-[#CCFF00]/20 transition-colors">
<span class="material-symbols-outlined text-[14px] text-[#CCFF00]">keyboard_arrow_down</span>
</div>
<span class="font-label-caps text-[8px] text-white/40 tracking-widest uppercase">Live Telemetry</span>
</div>
<div class="flex flex-col gap-0">
<div class="flex items-end gap-3">
<!-- Compact Circular Speedometer HUD -->
<div class="relative w-32 h-32 bg-[#121212]/40 backdrop-blur-lg rounded-full border border-white/5 p-3 carbon-fiber shadow-2xl">
<!-- Gauge Progress Track -->
<svg class="w-full h-full -rotate-90" viewbox="0 0 100 100">
<circle cx="50" cy="50" fill="none" r="45" stroke="rgba(255,255,255,0.05)" stroke-width="3"></circle>
<circle class="hud-glow" cx="50" cy="50" fill="none" r="45" stroke="#CCFF00" stroke-dasharray="283" stroke-dashoffset="160" stroke-width="5"></circle>
</svg>
<!-- Central Text -->
<div class="absolute inset-0 flex flex-col items-center justify-center">
<span class="font-stats-num text-2xl text-[#CCFF00] leading-none">45</span>
<span class="font-label-caps text-[8px] tracking-widest text-white/60">MPH</span>
</div>
<!-- Mini RPM Gauge Overlay -->
<div class="absolute bottom-3 left-1/2 -translate-x-1/2 w-10 h-0.5 bg-white/10 rounded-full overflow-hidden">
<div class="w-[60%] h-full bg-[#CCFF00]"></div>
</div>
</div>
<div class="flex flex-col gap-2">
<!-- Compact Trip Telemetry Data Card -->
<div class="bg-[#121212]/80 backdrop-blur-xl border border-white/10 p-2 rounded-sm machined-edge min-w-[120px] carbon-fiber mb-2">
<div class="flex justify-between items-center mb-1.5 border-b border-white/5 pb-1">
<span class="font-label-caps text-[8px] text-white/50">STATS</span>
<div class="flex items-center gap-1">
<div class="w-1 h-1 rounded-full bg-[#CCFF00]"></div>
<span class="font-label-caps text-[8px] text-[#CCFF00]">REC</span>
</div>
</div>
<div class="space-y-1">
<div class="flex justify-between items-baseline gap-2">
<span class="font-label-caps text-[7px] text-white/30">DIST</span>
<span class="font-stats-num text-[11px] text-[#CCFF00]">12.4 MI</span>
</div>
<div class="flex justify-between items-baseline gap-2">
<span class="font-label-caps text-[7px] text-white/30">TIME</span>
<span class="font-stats-num text-[11px] text-white">24:15</span>
</div>
</div>
</div>
<!-- Settings Panel -->
<div class="bg-[#121212]/80 backdrop-blur-xl border border-white/10 p-2 rounded-sm machined-edge min-w-[120px] carbon-fiber">
<div class="flex items-center gap-2 mb-2 border-b border-white/5 pb-1">
<span class="font-label-caps text-[7px] text-white/50 tracking-widest uppercase">Settings</span>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center">
<span class="font-label-caps text-[6px] text-white/40">SPEEDOMETER</span>
<div class="w-4 h-2 bg-black border border-white/10 rounded-full relative">
<div class="absolute right-0.5 top-0.5 w-1 h-1 bg-[#CCFF00] rounded-full shadow-[0_0_4px_#CCFF00]"></div>
</div>
</div>
<div class="flex justify-between items-center">
<span class="font-label-caps text-[6px] text-white/40">RPM GAUGE</span>
<div class="w-4 h-2 bg-black border border-white/10 rounded-full relative">
<div class="absolute right-0.5 top-0.5 w-1 h-1 bg-[#CCFF00] rounded-full shadow-[0_0_4px_#CCFF00]"></div>
</div>
</div>
<div class="flex justify-between items-center">
<span class="font-label-caps text-[6px] text-white/40">TRIP DATA</span>
<div class="w-4 h-2 bg-black border border-white/10 rounded-full relative">
<div class="absolute right-0.5 top-0.5 w-1 h-1 bg-[#CCFF00] rounded-full shadow-[0_0_4px_#CCFF00]"></div>
</div>
</div>
</div>
</div>
</div>
</div>
</div></div>
<!-- Interaction Overlay (Quick Actions) -->
<div class="absolute bottom-28 right-6 z-20">
<button class="bg-[#CCFF00] text-black px-8 py-5 rounded-sm font-label-caps text-base tracking-[0.2em] font-black shadow-[0_0_35px_rgba(204,255,0,0.6)] active:scale-95 hover:scale-105 transition-all flex items-center justify-center gap-4 group border-2 border-black/10" style=""><span class="material-symbols-outlined text-2xl group-hover:rotate-12 transition-transform" style="font-variation-settings: 'FILL' 1;">sports_motorsports</span>
<span class="uppercase">START RUN</span></button>
</div>
</main>
<!-- Bottom Navigation Bar -->
<footer class="fixed bottom-0 left-0 w-full z-50 bg-[#121212]/95 backdrop-blur-lg border-t border-white/10 flex justify-around items-center px-4 h-20 pb-safe shadow-[0_-4px_20px_rgba(0,0,0,0.8)] rounded-t-lg">
<!-- Map (Active) -->
<a class="flex flex-col items-center justify-center text-[#CCFF00] drop-shadow-[0_0_10px_rgba(204,255,0,0.6)] bg-white/5 rounded-lg py-1 w-full scale-90 transition-all" href="#" style="">
<span class="material-symbols-outlined" data-icon="bar_chart" style='font-variation-settings: "FILL" 1;'>bar_chart</span>
<span class="font-label-caps text-[10px] font-bold uppercase tracking-tighter mt-1" style="">Stats</span>
</a>
<!-- Lobbies -->
<a class="flex flex-col items-center justify-center text-gray-400 py-1 w-full hover:bg-white/10 hover:text-[#CCFF00] transition-all" href="#" style="">
<span class="material-symbols-outlined" data-icon="sports_esports" style="">sports_esports</span>
<span class="font-label-caps text-[10px] font-bold uppercase tracking-tighter mt-1" style="">Lobbies</span>
</a>
<!-- Meets -->
<a class="flex flex-col items-center justify-center text-gray-400 py-1 w-full hover:bg-white/10 hover:text-[#CCFF00] transition-all" href="#" style="">
<span class="material-symbols-outlined" data-icon="groups" style="">groups</span>
<span class="font-label-caps text-[10px] font-bold uppercase tracking-tighter mt-1" style="">Meets</span>
</a>
<!-- Squad -->
<a class="flex flex-col items-center justify-center text-gray-400 py-1 w-full hover:bg-white/10 hover:text-[#CCFF00] transition-all" href="#" style="">
<span class="material-symbols-outlined" data-icon="diversity_3" style="">diversity_3</span>
<span class="font-label-caps text-[10px] font-bold uppercase tracking-tighter mt-1" style="">Squad</span>
</a>
<!-- Profile -->
<a class="flex flex-col items-center justify-center text-gray-400 py-1 w-full hover:bg-white/10 hover:text-[#CCFF00] transition-all" href="#" style="">
<span class="material-symbols-outlined" data-icon="public" style="">public</span>
<span class="font-label-caps text-[10px] font-bold uppercase tracking-tighter mt-1" style="">Social</span>
</a>
</footer>
</body></html>
